name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate demo seed
        working-directory: backend
        env:
          USE_MOCK_DATA: "true"
        run: python -m app.seed.validate

      - name: Test backend
        working-directory: backend
        env:
          USE_MOCK_DATA: "true"
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Check launcher syntax
        run: bash -n start.sh

      - name: Build Cloud Run backend container
        run: docker build -t kbc-compass-api-ci ./backend

      - name: Build Cloud Run frontend container
        run: docker build -t kbc-compass-frontend-ci ./frontend

      - name: Start app with the public launcher
        run: |
          bash start.sh > /tmp/compass-launcher.log 2>&1 &
          echo $! > /tmp/compass-launcher.pid

      - name: Verify one-command frontend-backend integration
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8000/api/health
          for i in {1..60}; do
            curl -fsS http://localhost:3000/api/health && break
            sleep 0.5
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/customers | grep -q elise

      - name: Stop launcher
        if: always()
        run: |
          if [ -f /tmp/compass-launcher.pid ]; then
            kill "$(cat /tmp/compass-launcher.pid)" 2>/dev/null || true
            sleep 2
          fi

      - name: Print launcher logs on failure
        if: failure()
        run: cat /tmp/compass-launcher.log 2>/dev/null || true
